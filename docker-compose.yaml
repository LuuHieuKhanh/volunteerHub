services:
  volunteer-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volunteer-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=volunteer;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: User12345678
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    depends_on:
      - sqlserver
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "User12345678"
    volumes:
      - sqlserver-data:/var/opt/mssql
#      - ./sqlserver-data/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  sqlserver-data:
